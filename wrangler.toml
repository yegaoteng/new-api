# ============================================================
# 不知名社区 · Wrangler 配置
# 部署前把 database_id / id 换成你自己的（见 README 第 2、3 步）
# ============================================================
name = "buzhiming-community"
main = "worker.js"
compatibility_date = "2025-01-01"

# 允许 `import HTML from './index.html'` 把 HTML 当纯文本模块导入
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

# D1：帖子 / 评论 / 点赞 / 举报 / 模组 / 用户
[[d1_databases]]
binding = "DB"
database_name = "bzm-db"
database_id = "cc4a75f8-28fb-4a68-bc62-cba7efbee0c4"

# KV：会话、邮箱验证码、OAuth state、热度去重、限流
[[kv_namespaces]]
binding = "KV"
id = "a2ce0e73d71c4a93b8a9360ea595e1bc"

# ------------------------------------------------------------
# 非敏感配置，可以直接写在 [vars]
# 密钥一律用 `wrangler secret put`，见 .dev.vars.example / README
# ------------------------------------------------------------
[vars]
ADMIN_EMAILS = "2287681747@qq.com"
B2_APP_KEY = "K004tDYJwZFgO7i6nLe5b1IzyUWKR20"
B2_BUCKET = "buzhiming"
B2_ENDPOINT = "https://s3.us-west-004.backblazeb2.com"
B2_KEY_ID = "004103fe4fd3db90000000001"
B2_PROXY_ALIAS = "images"
B2_PUBLIC_BASE = "https://b.yenb.cc.cd/"
B2_REGION = "us-west-004"
BREVO_FROM_EMAIL = "sealblue@yenb.cc.cd"
BREVO_FROM_NAME = "不知名社区"
HOT_DEDUP_SECONDS = "300"
MAX_UPLOAD_MB = "10"
PAGE_SIZE = "20"
PRISM_BASE = "https://auth.ffurry.cc.cd"
PRISM_CLIENT_ID = "prism_5U7OybaWStOgj-WYBHyDyA"
PRISM_REDIRECT_URI = "https://comm.ffurry.cc.cd/api/auth/prism/callback"
SESSION_DAYS = "30"
SITE_NAME = "不知名社区"