<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>不知名社区</title>
<style>
:root{
  --primary:#5b6cf0;--primary-h:#4655d8;--primary-soft:#eef0ff;
  --bg:#f5f6fb;--card:#fff;--text:#1e2230;--muted:#858ba0;--border:#e7e9f1;
  --hover:#f7f8fd;--danger:#e5484d;--success:#12a06a;--warn:#e8930c;
  --radius:14px;--shadow:0 1px 2px rgba(30,34,48,.04),0 6px 20px -8px rgba(30,34,48,.12);
}
html[data-theme="dark"]{
  --primary:#8b96ff;--primary-h:#a3abff;--primary-soft:#272c50;
  --bg:#111319;--card:#1a1e28;--text:#e9ebf3;--muted:#8b90a4;--border:#2a2f3d;
  --hover:#232836;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
button,input,textarea,select{font:inherit}
img{max-width:100%}
.hide{display:none!important}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  height:56px;padding:0 14px;background:var(--card);border-bottom:1px solid var(--border)}
.hamb{width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--text);
  display:grid;place-items:center;cursor:pointer;flex:none}
.hamb:hover{background:var(--hover)}
.hamb svg{width:21px;height:21px}
.brand{font-weight:800;font-size:16.5px;letter-spacing:.3px;margin-right:auto;cursor:pointer}
.top-actions{display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--primary-soft);
  display:grid;place-items:center;color:var(--primary);font-weight:700;font-size:12px;flex:none;border:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* 抽屉 */
.drawer-mask{position:fixed;inset:0;background:rgba(12,15,24,.45);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.drawer-mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:270px;max-width:84vw;background:var(--card);
  z-index:61;transform:translateX(-102%);transition:transform .24s cubic-bezier(.2,.8,.3,1);
  display:flex;flex-direction:column;box-shadow:8px 0 40px -12px rgba(0,0,0,.28)}
.drawer.on{transform:none}
.dr-head{padding:20px 18px 14px;border-bottom:1px solid var(--border)}
.dr-head .t{font-weight:800;font-size:17px}
.dr-head .s{font-size:12px;color:var(--muted);margin-top:2px}
.dr-nav{padding:10px;overflow:auto;flex:1}
.dr-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border:0;border-radius:10px;
  background:transparent;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:3px}
.dr-item:hover{background:var(--hover)}
.dr-item.active{background:var(--primary-soft);color:var(--primary)}
.dr-item svg{width:18px;height:18px;flex:none}
.dr-foot{padding:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}

/* 布局 */
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 70px}
.page-head{display:flex;align-items:center;gap:10px;margin:4px 0 16px;flex-wrap:wrap}
.page-head h1{font-size:20px;margin:0;font-weight:800}
.page-head .sub{font-size:12.5px;color:var(--muted)}
.spacer{flex:1}

/* 按钮 / 表单 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;
  border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);
  font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{background:var(--hover);border-color:#cfd3e4}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-h);border-color:var(--primary-h)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.input,textarea.input,select.input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg);color:var(--text);outline:none;transition:.15s;font-size:14px}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,108,240,.14);background:var(--card)}
textarea.input{resize:vertical;min-height:170px;line-height:1.7}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;background:var(--hover);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:var(--card);
  font-size:12.5px;cursor:pointer;color:var(--muted);user-select:none}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.hint{font-size:12px;color:var(--muted);line-height:1.6}

/* 卡片列表 */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.post-card{padding:15px 16px;cursor:pointer;transition:.15s}
.post-card:hover{background:var(--hover)}
.post-card .t{font-size:16px;font-weight:700;margin:0 0 6px;line-height:1.45;word-break:break-word}
.post-card .ex{color:var(--muted);font-size:13px;line-height:1.65;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.post-card .meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:11px;font-size:12px;color:var(--muted)}
.post-card .meta .au{display:flex;align-items:center;gap:6px;color:var(--text);font-weight:600}
.post-thumb{width:100%;max-height:250px;object-fit:cover;display:block;background:var(--hover)}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;
  background:var(--primary-soft);color:var(--primary)}
.badge.gray{background:var(--hover);color:var(--muted)}

/* 详情 */
.detail{padding:20px 18px}
.detail h1{font-size:22px;margin:0 0 10px;line-height:1.4;word-break:break-word}
.detail .by{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;margin-bottom:18px}
.article{font-size:15px;line-height:1.85;word-break:break-word}
.article.plain{white-space:pre-wrap}
.article h1,.article h2,.article h3{margin:22px 0 10px;line-height:1.4}
.article h1{font-size:21px}.article h2{font-size:18px}.article h3{font-size:16px}
.article p{margin:0 0 12px}
.article ul,.article ol{margin:0 0 12px;padding-left:24px}
.article blockquote{margin:0 0 12px;padding:8px 14px;border-left:3px solid var(--primary);
  background:var(--hover);color:var(--muted);border-radius:0 8px 8px 0}
.article code{background:var(--hover);padding:2px 6px;border-radius:5px;font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.article pre{background:var(--hover);border:1px solid var(--border);border-radius:10px;
  padding:14px;overflow:auto;margin:0 0 14px}
.article pre code{background:none;padding:0;font-size:13px;line-height:1.6}
.article img{border-radius:10px;max-height:520px;object-fit:contain;background:var(--hover)}
.article hr{border:0;border-top:1px solid var(--border);margin:18px 0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0}
.gallery img{width:100%;height:140px;object-fit:cover;border-radius:10px;border:1px solid var(--border);cursor:zoom-in}
.gallery.big{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.gallery.big img{height:190px;object-fit:contain;background:var(--hover)}
.action-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;
  border-top:1px solid var(--border);background:var(--hover)}
.like-btn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}

/* 评论 */
.comment{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:10px}
.comment .bd{flex:1;min-width:0}
.comment .hd{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.comment .hd b{color:var(--text);font-size:13px}
.comment .tx{white-space:pre-wrap;word-break:break-word;font-size:14px}
.comment .c-del{margin-top:7px;padding:3px 9px;font-size:11.5px;color:var(--muted)}
.comment .c-del:hover{color:var(--danger);border-color:var(--danger)}
.comment-form{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--border)}
.comment-form textarea{flex:1;min-height:62px;resize:vertical}

/* 热度榜 */
.hot{margin-top:22px}
.hot h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hot h2 .ht{white-space:nowrap;flex:none}
.hot h2 .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* 内联图标统一尺寸：只有 viewBox、没有 width/height 的 inline SVG，
   在 flex 容器里会按默认 300×150 撑开（热度火焰曾被放大成半屏黑色图形）。 */
.ic{width:18px;height:18px;flex:none;display:block}
.btn .ic,.page-head .ic{width:15px;height:15px}
.hot h2 .ic{width:19px;height:19px;color:var(--warn)}
.hot-item{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.hot-item:last-child{border-bottom:0}
.hot-item:hover{background:var(--hover)}
.rank{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;
  background:var(--hover);color:var(--muted);flex:none}
.rank.top{background:linear-gradient(135deg,#ff9a44,#ff5f6d);color:#fff}
.hot-item .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:600}
.hot-item .vv{font-size:12px;color:var(--muted);white-space:nowrap}

/* 模组 */
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.mod-card:hover{transform:translateY(-2px);border-color:var(--primary)}
.mod-cover{height:130px;background:linear-gradient(135deg,var(--primary-soft),var(--hover));
  display:grid;place-items:center;font-size:34px;color:var(--primary);overflow:hidden}
.mod-cover img{width:100%;height:100%;object-fit:cover}
.mod-body{padding:13px 14px}
.mod-body .n{font-weight:700;font-size:15px;margin-bottom:5px;word-break:break-word}
.mod-body .s{font-size:12.5px;color:var(--muted);line-height:1.6;height:40px;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--hover);color:var(--muted)}
.tag.v{background:var(--primary-soft);color:var(--primary)}

/* 上传预览 */
.up-grid{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.up-item{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.up-item img{width:100%;height:100%;object-fit:cover}
.up-item .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border:0;border-radius:50%;
  background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:20px;cursor:pointer;text-align:center}
.uploading{opacity:.5}
.file-chip{display:flex;align-items:center;gap:10px;max-width:420px;padding:10px 12px;
  border:1px solid var(--border);border-radius:10px;background:var(--hover)}
.file-chip .fi{font-size:20px;flex:none}
.file-chip .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:600}
.file-chip .fn small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.file-chip .x{width:22px;height:22px;border:0;border-radius:50%;background:var(--border);
  color:var(--muted);cursor:pointer;flex:none;line-height:20px;text-align:center;font-size:14px}
.file-chip .x:hover{background:var(--danger);color:#fff}
.download-box{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0;
  padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--hover)}
.download-box .di{flex:1;min-width:180px}
.download-box .di b{display:block;font-size:14px;word-break:break-all}
.download-box .di small{color:var(--muted);font-size:12px}

/* 个人中心 */
.profile{display:flex;gap:16px;align-items:center;padding:18px;flex-wrap:wrap}
.profile .avatar{width:66px;height:66px;font-size:22px}
.profile .info{flex:1;min-width:180px}
.profile .info h2{margin:0 0 3px;font-size:18px}
.profile .info .m{font-size:12.5px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border)}
.stat{padding:13px;text-align:center;border-right:1px solid var(--border)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:18px}
.stat span{font-size:11.5px;color:var(--muted)}
.section{padding:18px;border-top:1px solid var(--border)}
.section h3{margin:0 0 14px;font-size:15px}

/* 登录 */
.auth-wrap{max-width:430px;margin:22px auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;font-size:13.5px;font-weight:600;
  color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.code-row{display:flex;gap:8px}
.code-row .input{flex:1}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:18px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.prism-btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:0}

/* 分页 */
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 0;font-size:13px;color:var(--muted)}

/* 空态 / 加载 */
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:38px;opacity:.4;display:block;margin-bottom:8px}
.loading{padding:50px;text-align:center;color:var(--muted)}

/* 模态框 */
.mask{position:fixed;inset:0;background:rgba(12,15,24,.5);z-index:80;display:grid;place-items:center;padding:18px}
.modal{width:100%;max-width:420px;background:var(--card);border-radius:16px;padding:22px;
  box-shadow:0 24px 60px -16px rgba(0,0,0,.45)}
.modal h3{margin:0 0 6px;font-size:16px}
.modal .desc{font-size:13px;color:var(--muted);margin:0 0 15px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.radio-list{display:flex;flex-direction:column;gap:6px}
.radio-list label{display:flex;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--border);
  border-radius:9px;cursor:pointer;font-size:13.5px}
.radio-list label:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}

/* Toast */
.toast-wrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 17px;border-radius:10px;background:#232736;color:#fff;font-size:13.5px;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.4);max-width:88vw;animation:tin .2s ease}
.toast.err{background:#d33a40}.toast.ok{background:#0d9668}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}

/* 图片放大 */
.lightbox{position:fixed;inset:0;background:rgba(8,10,16,.92);z-index:120;display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}

@media(max-width:640px){
  .wrap{padding:14px 10px 60px}
  .row2{grid-template-columns:1fr}
  .detail{padding:16px 14px}
  .detail h1{font-size:19px}
  .comment-form{flex-direction:column}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:0}
  .page-head h1{font-size:18px}
}

/* ============================================================
   平缓过渡体系（时长较长、曲线柔和；放在最后覆盖前面的 .15s）
   ============================================================ */
:root{
  --dur:520ms;                 /* 主过渡时长 */
  --dur-fast:340ms;            /* 进度条等反馈 */
  --ease:cubic-bezier(.22,1,.36,1);
}
.btn,.input,textarea.input,select.input,.chip,.tag,.badge,.rank,.card,.mod-card,
.post-card,.hot-item,.dr-item,.seg button,.tabs button,.avatar,.up-item,.file-chip,
.toast,.modal,.mask,.drawer,.drawer-mask,.dep-item,.stat,.comment,.action-bar,
.page-head,.download-box,.gallery img,#meBtn,.mine-item,.upload-progress{
  transition:background-color var(--dur) var(--ease),
             border-color var(--dur) var(--ease),
             color var(--dur) var(--ease),
             box-shadow var(--dur) var(--ease),
             transform var(--dur) var(--ease),
             opacity var(--dur) var(--ease),
             width var(--dur-fast) var(--ease);
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.primary:hover{box-shadow:0 8px 22px -8px var(--primary)}
.post-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px -14px rgba(30,34,48,.28)}
.mod-card:hover{transform:translateY(-5px);box-shadow:0 16px 34px -16px rgba(30,34,48,.35)}
.chip:hover{transform:translateY(-2px);border-color:var(--primary)}
.hot-item:hover{padding-left:20px}
.dr-item:hover{padding-left:19px}

/* 页面进入 / 列表逐项渐入 */
@keyframes pageIn{from{opacity:0;transform:translateY(16px) scale(.994)}to{opacity:1;transform:none}}
@keyframes itemIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.page-anim{animation:pageIn var(--dur) var(--ease) both}
.item-in{animation:itemIn var(--dur) var(--ease) both}

/* 旋转指示器 */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);
  border-top-color:var(--primary);border-radius:50%;animation:spin .9s linear infinite;flex:none}
.spinner.sm{width:14px;height:14px;border-width:2px}
.spinner.big{width:30px;height:30px;border-width:3px}
.spinner.light{border-color:rgba(255,255,255,.3);border-top-color:#fff}

/* 加载骨架 */
.loading-box{padding:34px 20px;text-align:center;color:var(--muted)}
.loading-box .lt{margin:12px 0 18px;font-size:13px;letter-spacing:.4px}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton{height:12px;border-radius:8px;margin:0 auto 10px;
  background:linear-gradient(90deg,var(--hover) 25%,var(--border) 50%,var(--hover) 75%);
  background-size:200% 100%;animation:shimmer 1.8s linear infinite}
.skeleton.sk1{width:82%}.skeleton.sk2{width:64%}.skeleton.sk3{width:73%;height:40px;border-radius:12px}

/* 顶部全局请求进度条 */
.top-progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:150;opacity:0;
  background:linear-gradient(90deg,var(--primary),#8b5cf6,var(--primary));
  background-size:200% 100%;box-shadow:0 0 12px var(--primary);
  transition:width var(--dur-fast) var(--ease),opacity var(--dur) var(--ease)}
.top-progress.on{opacity:1}
@keyframes flow{to{background-position:200% 0}}
.top-progress.on{animation:flow 1.6s linear infinite}

/* 上传进度条 */
.upload-progress{margin-top:12px;padding:13px 14px;border:1px solid var(--border);
  border-radius:12px;background:var(--hover)}
.up-head{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;margin-bottom:10px}
.up-head .spinner{width:15px;height:15px}
.up-pct{margin-left:auto;color:var(--primary);font-variant-numeric:tabular-nums}
.up-track{height:9px;border-radius:99px;background:var(--card);border:1px solid var(--border);overflow:hidden}
.up-fill{height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--primary),#8b5cf6);
  transition:width var(--dur-fast) var(--ease)}
.up-sub{margin-top:8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 上传完成后的文件操作 */
.up-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.file-chip{animation:itemIn var(--dur) var(--ease) both}

/* 右上角头像：独立修复，不再复用 grid 版 .avatar 的外壳 */
#meBtn{width:34px;height:34px;min-width:34px;padding:0;border-radius:50%;overflow:hidden;
  position:relative;display:block;flex:none;border:1px solid var(--border);
  background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:13px;
  line-height:32px;text-align:center;cursor:pointer}
#meBtn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  display:block;border-radius:50%}
#meBtn:hover{transform:scale(1.07);box-shadow:0 0 0 3px var(--primary-soft)}

/* 作者头像 / 名字 → 公开资料页 */
.avatar-link{display:inline-flex;flex:none;cursor:pointer;border-radius:50%;
  transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.avatar-link:hover{transform:scale(1.09);box-shadow:0 0 0 3px var(--primary-soft)}
.user-link{cursor:pointer;color:var(--text);font-weight:600;
  transition:color var(--dur) var(--ease)}
.user-link:hover{color:var(--primary);text-decoration:underline;text-underline-offset:3px}
.mod-author{display:flex;align-items:center;gap:7px;margin-top:9px;
  font-size:12px;color:var(--muted)}
.mod-author .avatar{width:23px;height:23px;font-size:10px}
.mod-author .user-link{font-weight:600}

/* 依赖模组 */
.dep-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.dep-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);
  border-radius:10px;background:var(--hover);animation:itemIn var(--dur) var(--ease) both}
.dep-item .di{font-size:19px;flex:none}
.dep-item .dn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:13.5px;font-weight:600}
.dep-item .dn small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.dep-item .x{width:24px;height:24px;border:0;border-radius:50%;background:var(--border);
  color:var(--muted);cursor:pointer;flex:none;font-size:14px;line-height:22px;text-align:center}
.dep-item .x:hover{background:var(--danger);color:#fff}
.dep-pick{max-height:230px;overflow:auto;margin-top:10px;border:1px solid var(--border);border-radius:10px}
.dep-pick label{display:flex;gap:9px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--border);
  font-size:13px;cursor:pointer}
.dep-pick label:last-child{border-bottom:0}
.dep-pick label:has(input:checked){background:var(--primary-soft)}

/* 我发布的内容 */
.mine-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.mine-item:last-child{border-bottom:0}
.mine-item .mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:600}
.mine-item .md{font-size:11.5px;color:var(--muted);white-space:nowrap}

/* Toast 内联 spinner 与平缓入场 */
.toast{animation:tin var(--dur) var(--ease)}   /* 不能用 both：否则会盖住淡出时的内联 opacity */
.toast .spinner{vertical-align:-3px;margin-right:8px}
.toast .tx{vertical-align:middle}

/* 模态框 / 遮罩 / 图片放大 */
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
.modal{animation:modalIn var(--dur) var(--ease) both}
.mask:not(.hide){animation:maskIn var(--dur) var(--ease) both}
.lightbox{animation:maskIn var(--dur) var(--ease) both}
.lightbox img{animation:modalIn var(--dur) var(--ease) both}

/* 尊重系统「减少动态效果」 */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}
</style>
</head>

<script>
(function () {
'use strict';

/* ---------------- 基础 ---------------- */
const $ = s => document.querySelector(s);
const state = {
  boot: null, me: null, route: null, page: 1, q: '', build: '',
  postImages: [], modImage: '', modIntro: [], modFile: null,
  modLoaders: [], modDeps: [], postFormat: 'plain',
  modUploading: false, busy: false,
};
function fmtSize(n){
  n = Number(n) || 0;
  if (n >= 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' B';
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---- Toast：普通调用照旧自动消失；加 loading:true 时返回可更新的句柄 ---- */
function toast(msg, type, opts){
  opts = opts || {};
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  const spin = opts.loading ? '<span class="spinner sm light"></span>' : '';
  el.innerHTML = spin + '<span class="tx"></span>';
  el.querySelector('.tx').textContent = msg;
  $('#toastWrap').appendChild(el);
  let closed = false, timer = null;
  const scheduleClose = (delay) => {
    if (closed) return;
    timer = setTimeout(() => {
      el.style.transition = 'opacity var(--dur) var(--ease), transform var(--dur) var(--ease)';
      el.style.opacity = '0'; el.style.transform = 'translateY(-8px)';
      setTimeout(() => el.remove(), 540);
      closed = true;
    }, delay == null ? 2600 : delay);
  };
  const h = {
    el,
    set(text, cls){
      el.querySelector('.tx').textContent = text;
      const s = el.querySelector('.spinner'); if (s) s.remove();
      el.className = 'toast ' + (cls || type || '');
    },
    done(text, cls){ h.set(text || '完成', cls || 'ok'); scheduleClose(1800); },
    fail(text){ h.set(text || '操作失败', 'err'); scheduleClose(3600); },
    close(){ if (timer) clearTimeout(timer); el.remove(); closed = true; },
  };
  if (!opts.loading) scheduleClose();
  return h;
}

/* ---- 统一加载动画：旋转环 + 文字 + 骨架屏 ---- */
function loadingHtml(text){
  return `<div class="loading-box"><div class="spinner big"></div>
    <div class="lt">${esc(text || '加载中…')}</div>
    <div class="skeleton sk1"></div><div class="skeleton sk2"></div><div class="skeleton sk3"></div></div>`;
}

/* ---- 全局请求进度条（所有 api 请求 + 上传共用） ---- */
let pendingReq = 0;
function reqStart(){
  pendingReq++;
  const p = $('#topProgress'); if (!p) return;
  p.classList.add('on');
  p.style.width = pendingReq === 1 ? '22%' : '68%';
}
function reqEnd(){
  pendingReq = Math.max(0, pendingReq - 1);
  const p = $('#topProgress'); if (!p) return;
  if (pendingReq === 0) {
    p.style.width = '100%';
    setTimeout(() => { if (pendingReq === 0) { p.classList.remove('on'); p.style.width = '0'; } }, 480);
  }
}

/* ---- 带真实进度的上传（XMLHttpRequest 才能拿到 upload.onprogress） ---- */
function uploadFile(file, headers, onProgress){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload', true);
    xhr.withCredentials = true;
    for (const [k, v] of Object.entries(headers)) xhr.setRequestHeader(k, String(v));
    xhr.upload.onprogress = e => {
      if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total, e.loaded, e.total);
    };
    xhr.onload = () => {
      let d;
      try { d = JSON.parse(xhr.responseText); }
      catch { return reject(new Error('服务器返回异常（HTTP ' + xhr.status + '）')); }
      if (!d.ok) {
        let msg = d.error || '请求失败';
        if (d.detail) msg += '｜' + String(d.detail).slice(0, 110);
        if (d.build) msg += '｜版本 ' + d.build;
        const e = new Error(msg); e.code = d.code; e.status = xhr.status;
        e.detail = d.detail; e.build = d.build;
        return reject(e);
      }
      state.build = d.build || state.build;
      resolve(d);
    };
    xhr.onerror = () => reject(new Error('网络中断，上传失败'));
    xhr.onabort = () => reject(new Error('上传已取消'));
    xhr.send(file);
  });
}
function fmtTime(ts){
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  if (isNaN(d)) return '—';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtNum(n){ n = Number(n)||0; return n >= 10000 ? (n/10000).toFixed(1)+'w' : String(n); }
function avatarHtml(u, size, clickable){
  const cls = 'avatar' + (size ? ' lg' : '');
  const inner = (u && u.avatar)
    ? `<img src="${esc(u.avatar)}" alt="" onerror="this.style.display='none'">`
    : esc(((u && (u.displayName || u.username)) || '?').slice(0, 1).toUpperCase());
  const span = `<span class="${cls}">${inner}</span>`;
  const key = u && (u.id || u.username);
  if (clickable === false || !key) return span;
  const name = (u.displayName || u.username || '用户');
  return `<span class="avatar-link" data-user="${esc(key)}" title="查看 ${esc(name)} 的主页">${span}</span>`;
}
/* 作者名也可点，统一走公开资料页 */
function userLink(u, text){
  const key = u && (u.id || u.username);
  if (!key) return esc(text || '');
  return `<span class="user-link" data-user="${esc(key)}" title="查看公开资料">${esc(text || u.displayName || u.username || '用户')}</span>`;
}
/* 捕获阶段拦截：头像/名字在帖子卡片内部，必须先于卡片的 onclick 处理 */
document.addEventListener('click', e => {
  const el = e.target && e.target.closest ? e.target.closest('[data-user]') : null;
  if (!el) return;
  e.preventDefault(); e.stopPropagation();
  go('#/user/' + encodeURIComponent(el.dataset.user));
}, true);
async function api(path, opts){
  const o = Object.assign({ method: 'GET', headers: {} }, opts || {});
  const raw = o.body && (o.body instanceof ArrayBuffer || o.body instanceof Blob ||
    (typeof FormData !== 'undefined' && o.body instanceof FormData));
  if (o.body && !raw && typeof o.body !== 'string') {
    o.headers['Content-Type'] = 'application/json';
    o.body = JSON.stringify(o.body);
  }
  reqStart();
  let res;
  try { res = await fetch(path, o); }
  catch (e) { reqEnd(); throw e; }
  reqEnd();
  let d;
  try { d = await res.json(); } catch { throw new Error('服务器返回异常（HTTP ' + res.status + '）'); }
  if (!d.ok) {
    let msg = d.error || '请求失败';
    if (d.detail) msg += '｜' + String(d.detail).slice(0, 110);
    if (d.build) msg += '｜版本 ' + d.build;
    const e = new Error(msg);
    e.code = d.code; e.status = res.status;
    e.detail = d.detail; e.build = d.build;
    throw e;
  }
  state.build = d.build || state.build;
  return d;
}
function go(hash){ if (location.hash === hash) renderRoute(); else location.hash = hash; }
function needLogin(){ if (!state.me) { toast('请先登录', 'err'); go('#/login'); return false; } return true; }

/* ---------------- 抽屉 ---------------- */
const ICON = {
  home: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
  box: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
  user: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  plus: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  fire: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s4 4 4 8a4 4 0 0 1-8 0c0-1 .5-2 1-3 0 2 1 3 2 3 0-3-1-5 1-8z"/><path d="M12 22a7 7 0 0 0 7-7c0-3-2-5-3-7 0 3-1 4-2 5-1-2-1-4-1-6-3 2-8 5-8 11a7 7 0 0 0 7 4z"/></svg>',
  out: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
};
function navItems(){
  const arr = [
    { k:'community', label:'社区', icon:ICON.home, hash:'#/community' },
    { k:'new',       label:'发布帖子', icon:ICON.plus, hash:'#/new' },
    { k:'mods',      label:'模组中心', icon:ICON.box, hash:'#/mods' },
    { k:'modnew',    label:'发布模组', icon:ICON.plus, hash:'#/mod/new' },
    { k:'me',        label:'个人中心', icon:ICON.user, hash:'#/me' },
  ];
  return arr;
}
function renderDrawer(){
  const cur = (state.route && state.route.name) || 'community';
  $('#drNav').innerHTML = navItems().map(it =>
    `<button class="dr-item ${cur === it.k ? 'active' : ''}" data-hash="${it.hash}">${it.icon}<span>${esc(it.label)}</span></button>`
  ).join('') + (state.me
    ? `<button class="dr-item" id="drLogout">${ICON.out}<span>退出登录</span></button>` : '');
  $('#drNav').querySelectorAll('[data-hash]').forEach(b => b.onclick = () => { closeDrawer(); go(b.dataset.hash); });
  const lo = $('#drLogout');
  if (lo) lo.onclick = async () => {
    try { await api('/api/auth/logout', { method:'POST' }); } catch (_) {}
    state.me = null; closeDrawer(); updateTop(); toast('已退出登录', 'ok'); go('#/community');
  };
}
function setTopAvatar(u){
  const btn = $('#meBtn');
  const initial = ((u && (u.displayName || u.username)) || '?').slice(0, 1).toUpperCase();
  const showInitial = () => { btn.textContent = initial; };
  const showImg = (img) => { btn.textContent = ''; btn.appendChild(img); };
  showInitial();
  if (!u || !u.avatar) return;
  const img = document.createElement('img');
  img.alt = '';
  img.onerror = showInitial;               // 破图 → 回退首字母
  img.onload = () => showImg(img);
  img.src = u.avatar;
  if (img.complete && img.naturalWidth > 0) showImg(img);   // 缓存命中
}
function openDrawer(){ renderDrawer(); $('#drawer').classList.add('on'); $('#drawerMask').classList.add('on'); }
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#drawerMask').classList.remove('on'); }
function updateTop(){
  $('#brand').textContent = (state.boot && state.boot.siteName) || '不知名社区';
  document.title = (state.boot && state.boot.siteName) || '不知名社区';
  const has = !!state.me;
  $('#loginBtn').style.display = has ? 'none' : '';
  $('#meBtn').style.display = has ? '' : 'none';
  if (has) setTopAvatar(state.me);
  $('#drSub').textContent = has ? ('你好，' + (state.me.displayName || state.me.username)) : '登录后可发帖、评论和点赞';
  $('#drFoot').textContent = '© ' + ((state.boot && state.boot.siteName) || '不知名社区')
    + (state.build ? ' · ' + state.build : '');
  $('#drTitle').textContent = (state.boot && state.boot.siteName) || '不知名社区';
}

/* ---------------- 模态框 ---------------- */
let modalResolve = null;
function openModal(html){
  $('#modalBox').innerHTML = html;
  $('#mask').classList.remove('hide');
  return new Promise(r => { modalResolve = r; });
}
function closeModal(v){ $('#mask').classList.add('hide'); if (modalResolve) { modalResolve(v); modalResolve = null; } }
$('#mask').addEventListener('click', e => { if (e.target === $('#mask')) closeModal(null); });

/* ---------------- Markdown（先转义，再解析，杜绝 XSS） ---------------- */
function safeUrl(u){
  const s = String(u || '').trim();
  if (/^https?:\/\//i.test(s)) return s;
  if (s.startsWith('/') && !s.startsWith('//')) return s;
  return '#';
}
function inline(s){
  return s
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, a, u) => `<img src="${safeUrl(u)}" alt="${a}" loading="lazy">`)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => `<a href="${safeUrl(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>');
}
function mdToHtml(src){
  const codes = [];
  let s = String(src || '').replace(/```([\w+-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
    codes.push(`<pre><code data-lang="${esc(lang)}">${esc(code)}</code></pre>`);
    return '\u0001CODE' + (codes.length - 1) + '\u0001';
  });
  s = esc(s);
  const lines = s.split('\n');
  let out = '', para = [], list = null, quote = [];
  const flushPara = () => { if (para.length) { out += '<p>' + inline(para.join('<br>')) + '</p>'; para = []; } };
  const flushList = () => { if (list) { out += `<${list}>` + listBuf.join('') + `</${list}>`; list = null; listBuf = []; } };
  const flushQuote = () => { if (quote.length) { out += '<blockquote>' + inline(quote.join('<br>')) + '</blockquote>'; quote = []; } };
  let listBuf = [];
  for (let raw of lines) {
    const line = raw.replace(/\s+$/, '');
    if (/^\u0001CODE\d+\u0001$/.test(line.trim())) {
      flushPara(); flushList(); flushQuote();
      out += codes[Number(line.trim().match(/CODE(\d+)/)[1])];
      continue;
    }
    if (line.trim() === '') { flushPara(); flushList(); flushQuote(); continue; }
    if (/^(-{3,}|\*{3,})$/.test(line.trim())) { flushPara(); flushList(); flushQuote(); out += '<hr>'; continue; }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      flushPara(); flushList(); flushQuote();
      const n = m[1].length; out += `<h${n}>${inline(m[2])}</h${n}>`; continue;
    }
    if ((m = line.match(/^&gt;\s?(.*)$/))) {
      flushPara(); flushList(); quote.push(m[1]); continue;
    }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
      flushPara(); flushQuote();
      if (list !== 'ul') { flushList(); list = 'ul'; }
      listBuf.push('<li>' + inline(m[1]) + '</li>'); continue;
    }
    if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) {
      flushPara(); flushQuote();
      if (list !== 'ol') { flushList(); list = 'ol'; }
      listBuf.push('<li>' + inline(m[1]) + '</li>'); continue;
    }
    flushList(); flushQuote(); para.push(line);
  }
  flushPara(); flushList(); flushQuote();
  return out;
}

/* ---------------- 文件上传（图片 / 模组包，带真实进度） ---------------- */
// post=帖子配图 | modcover=模组封面 | modintro=模组介绍图 | modfile=模组本体 | avatar=头像
let uploadTarget = 'post';
function pickImages(target){
  uploadTarget = target;
  const fp = $('#filePicker');
  fp.multiple = (target === 'post' || target === 'modintro');
  fp.accept = target === 'modfile'
    ? '.jar,.zip,.mrpack,application/java-archive,application/zip,application/octet-stream'
    : 'image/png,image/jpeg,image/gif,image/webp,image/avif,image/svg+xml';
  fp.click();
}
$('#filePicker').addEventListener('change', async e => {
  const target = uploadTarget;
  const isModFile = target === 'modfile';
  let files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  if (!needLogin()) return;
  if (isModFile || target === 'modcover') files = files.slice(0, 1);   // 模组本体 / 封面都只允许 1 个
  if (target === 'modintro') {
    const room = Math.max(0, 9 - state.modIntro.length);
    if (!room) { toast('介绍图最多 9 张，请先移除几张再上传', 'err'); return; }
    files = files.slice(0, room);
  }
  const maxMB = (state.boot && (isModFile ? state.boot.maxModMB : state.boot.maxUploadMB)) || (isModFile ? 30 : 10);
  for (const f of files) {
    if (f.size > maxMB * 1024 * 1024) { toast(`${f.name} 超过 ${maxMB}MB`, 'err'); continue; }
    if (isModFile && !/\.(jar|zip|mrpack)$/i.test(f.name)) { toast('仅支持 .jar / .zip / .mrpack', 'err'); continue; }
    const tip = toast('正在上传 ' + f.name + '（' + fmtSize(f.size) + '）', '', { loading:true });
    const headers = {
      'Content-Type': isModFile ? 'application/octet-stream' : (f.type || 'application/octet-stream'),
      'X-File-Name': encodeURIComponent(f.name),
      'X-Upload-Kind': isModFile ? 'mod' : 'image',
    };
    // 模组文件：按钮下方显示真实进度条
    if (isModFile) { state.modUploading = true; setModProgress(0, 0, f.size, f.name); }
    reqStart();
    try {
      const d = await uploadFile(f, headers, (pct, loaded, total) => {
        if (isModFile) setModProgress(pct, loaded, total, f.name);
        else tip.set('正在上传 ' + f.name + '　' + Math.round(pct * 100) + '%', '');
      });
      if (target === 'post') { state.postImages.push(d.url); renderUpGrid(); }
      else if (target === 'modcover') { state.modImage = d.url; renderModImage(); }
      else if (target === 'modintro') { state.modIntro.push(d.url); renderModIntro(); }
      else if (target === 'modfile') {
        state.modFile = { url: d.url, name: d.name || f.name, size: d.size || f.size };
        state.modUploading = false; renderModFile();       // 完成后在按钮下方显示文件
      }
      else if (target === 'avatar') {
        $('#avatarUrl').value = d.url;
        $('#avatarPreview').innerHTML = avatarHtml({ avatar: d.url });
      }
      tip.done('上传完成：' + f.name);
    } catch (err) {
      if (isModFile) { state.modUploading = false; renderModFile(); }
      tip.fail('上传失败：' + err.message);
    } finally { reqEnd(); }
  }
});

function setModProgress(pct, loaded, total, name){

    box.innerHTML = `<div class="upload-progress">
      <div class="up-head"><span class="spinner"></span><span class="un">正在上传模组…</span><span class="up-pct">0%</span></div>

  el.querySelector('.up-pct').textContent = p + '%';

  $('#fmtMd').onclick = () => setFmt('markdown');

    const box = $('#previewBox');
    box.classList.toggle('hide');
    if (!box.classList.contains('hide')) $('#mdPreview').innerHTML = state.postFormat === 'markdown'
      ? mdToHtml($('#pBody').value) : `<div class="plain" style="white-space:pre-wrap">${esc($('#pBody').value)}</div>`;
  };
  $('#publishBtn').onclick = async () => {
    const title = $('#pTitle').value.trim(), body = $('#pBody').value.trim();
    if (title.length < 2) { toast('标题至少 2 个字', 'err'); return; }
    if (body.length < 2) { toast('内容不能为空', 'err'); return; }
    btnBusy($('#publishBtn'), true, edit ? '保存中…' : '发布中…');
    try {
      const payload = { title, body, format:state.postFormat, images:state.postImages };
      const d = edit
        ? await api('/api/posts/' + edit.id + '/edit', { method:'POST', body:payload })
        : await api('/api/posts', { method:'POST', body:payload });
      toast(edit ? '修改已保存' : '发布成功', 'ok');
      go('#/post/' + (edit ? edit.id : d.id));
    } catch (e) { toast(e.message, 'err'); btnBusy($('#publishBtn'), false); }
  };
  setFmt(state.postFormat);
  renderUpGrid();
}
function setFmt(f){
  state.postFormat = f;
  $('#fmtPlain').classList.toggle('on', f === 'plain');
  $('#fmtMd').classList.toggle('on', f === 'markdown');
  $('#fmtHint').textContent = f === 'markdown' ? '支持标题、粗斜体、列表、引用、代码块、链接与图片。' : '标准文本会原样保留换行与空格。';
}

      toast(edit ? '修改已保存' : '发布成功', 'ok');
      go('#/mod/' + (edit ? edit.id : d.id));
    } catch (e) { toast(e.message, 'err'); btnBusy($('#mPublish'), false); }
  };
  renderModImage();
  renderModIntro();
  renderModFile();
  renderDeps();
}

    box.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
    box.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => go(b.dataset.edit));
  } catch (e) { box.innerHTML = `<div class="hint">加载失败：${esc(e.message)}</div>`; }
}

/* ---------------- 视图：个人中心 ---------------- */
async function viewMe(){
  if (!needLogin()) return;
  $('#app').innerHTML = loadingHtml('加载中…');
  let d;
  try { d = await api('/api/me'); }
  catch (e) { $('#app').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  const u = d.me, s = d.stats;
  $('#app').innerHTML = `
    <div class="page-head"><h1>个人中心</h1></div>
    <div class="card">
      <div class="profile"><span id="avatarPreview">${avatarHtml(u, null, false)}</span>
        <div class="info"><h2>${esc(u.displayName || u.username)}</h2>
          <div class="m">@${esc(u.username)} · ${esc(u.email)} ${u.role === 'admin' ? '· <span class="badge">管理员</span>' : ''}</div>
          <div class="m">注册于 ${fmtTime(u.createdAt)}</div></div></div>
      <div class="stats"><div class="stat"><b>${fmtNum(s.posts)}</b><span>帖子</span></div>
        <div class="stat"><b>${fmtNum(s.comments)}</b><span>评论</span></div>
        <div class="stat"><b>${fmtNum(s.likes)}</b><span>点赞</span></div>
        <div class="stat"><b>${fmtNum(s.mods)}</b><span>模组</span></div></div>
      <div class="section"><h3>修改资料</h3>
        <div class="row2">
          <div class="field"><label>用户名</label><input class="input" id="uName" value="${esc(u.username)}" maxlength="20"></div>
          <div class="field"><label>显示名称</label><input class="input" id="uDisplay" value="${esc(u.displayName)}" maxlength="30"></div>
        </div>
        <div class="field"><label>个人简介</label><textarea class="input" id="uBio" style="min-height:80px" maxlength="200" placeholder="介绍一下自己…">${esc(u.bio)}</textarea></div>
        <div class="field"><label>头像</label>
          <div style="display:flex;gap:8px;align-items:center"><input class="input" id="avatarUrl" value="${esc(u.avatar)}" placeholder="留空则使用首字母头像">
            <button class="btn sm" id="pickAvatar">上传</button></div>
          <div class="hint" style="margin-top:5px">也可直接粘贴图片链接。</div></div>
        <button class="btn primary" id="saveProfile">保存资料</button></div>
      ${u.hasPassword ? `<div class="section"><h3>修改密码</h3>
        <div class="row2"><div class="field"><label>原密码</label><input class="input" type="password" id="oldPw"></div>
          <div class="field"><label>新密码（8 位以上）</label><input class="input" type="password" id="newPw"></div></div>
        <button class="btn" id="savePw">修改密码</button>
        <div class="hint" style="margin-top:8px">修改后其它设备的登录状态会失效。</div></div>`
        : '<div class="section"><div class="hint">该账号通过 Prism 授权登录，不支持修改本站密码。</div></div>'}
    </div>
    ${u.role === 'admin' ? '<div class="card" style="padding:16px"><h3 style="margin:0 0 10px">管理</h3><button class="btn sm" id="adminReports">查看举报</button><div id="reportList"></div></div>' : ''}
    <div class="card" style="padding:16px"><h3 style="margin:0 0 10px">我发布的内容</h3>
      <div class="hint" style="margin-bottom:10px">这里可以直接修改已发布的帖子与模组信息。</div>
      <div id="mineBox">${loadingHtml('加载中…')}</div></div>`;
  renderMine();
  $('#pickAvatar').onclick = () => pickImages('avatar');
  $('#saveProfile').onclick = async () => {
    try {
      const r = await api('/api/me/update', { method:'POST', body:{
        username: $('#uName').value.trim(), displayName: $('#uDisplay').value.trim(),
        bio: $('#uBio').value, avatar: $('#avatarUrl').value.trim() } });
      state.me = r.me; updateTop(); toast('资料已保存', 'ok');
    } catch (e) { toast(e.message, 'err'); }
  };
  const sp = $('#savePw');
  if (sp) sp.onclick = async () => {
    try {
      const r = await api('/api/me/password', { method:'POST', body:{ oldPassword:$('#oldPw').value, newPassword:$('#newPw').value } });
      state.me = r.me; $('#oldPw').value = ''; $('#newPw').value = ''; toast('密码已修改', 'ok');
    } catch (e) { toast(e.message, 'err'); }
  };
  const ar = $('#adminReports');
  if (ar) ar.onclick = async () => {
    try {
      const r = await api('/api/admin/reports');
      $('#reportList').innerHTML = r.items.length ? r.items.map(x => `
        <div class="comment"><div class="bd"><div class="hd"><b>${esc(x.reason)}</b> ${esc(x.target_type)} · ${esc(x.reporter)} · ${fmtTime(x.created_at)}</div>
        <div class="tx">${esc(x.detail || '（无补充说明）')}</div>
        <div style="margin-top:8px;display:flex;gap:6px"><button class="btn sm" data-hide="${esc(x.id)}">隐藏内容并结案</button><button class="btn sm ghost" data-dismiss="${esc(x.id)}">忽略</button></div></div></div>`).join('')
        : '<div class="hint" style="padding:12px">暂无待处理举报</div>';
      $('#reportList').querySelectorAll('[data-hide]').forEach(b => b.onclick = () => handleReport(b.dataset.hide, true));
      $('#reportList').querySelectorAll('[data-dismiss]').forEach(b => b.onclick = () => handleReport(b.dataset.dismiss, false));
    } catch (e) { toast(e.message, 'err'); }
  };
}
async function handleReport(id, hide){
  try {
    await api('/api/admin/reports/' + id, { method:'POST', body:{ status: hide ? 'resolved' : 'dismissed', hideTarget: hide } });
    toast('已处理', 'ok'); $('#adminReports').click();
  } catch (e) { toast(e.message, 'err'); }
}

/* ---------------- 视图：登录 / 注册 ---------------- */
let authTab = 'login';
function viewLogin(){
  const b = state.boot || {};
  const tabBtn = (k, t) => `<button class="${authTab===k?'on':''}" data-tab="${k}">${t}</button>`;
  $('#app').innerHTML = `<div class="auth-wrap"><div class="card" style="padding:20px">
    <div class="tabs">
      ${tabBtn('login','密码登录')}${tabBtn('code','验证码登录')}${tabBtn('register','邮箱注册')}${tabBtn('reset','忘记密码')}
    </div>
    <div id="authBody"></div>
    ${b.prismEnabled ? `<div class="divider">或</div><button class="btn prism-btn" id="prismBtn" style="width:100%">使用 Prism 授权登录</button>` : ''}
    ${!b.mailEnabled ? '<div class="hint" style="margin-top:12px;color:var(--warn)">⚠ 邮件服务未配置，注册与验证码登录暂不可用，可先用 Prism 登录。</div>' : ''}
  </div></div>`;
  $('#app').querySelectorAll('[data-tab]').forEach(x => x.onclick = () => { authTab = x.dataset.tab; viewLogin(); });
  const pb = $('#prismBtn'); if (pb) pb.onclick = () => location.href = '/api/auth/prism/login';
  renderAuthBody();
}
function renderAuthBody(){
  const box = $('#authBody');
  const codeRow = (scene) => `<div class="field"><label>邮箱验证码</label><div class="code-row">
      <input class="input" id="aCode" inputmode="numeric" maxlength="6" placeholder="6 位验证码">
      <button class="btn" id="sendCode" data-scene="${scene}">获取验证码</button></div>
      <div class="hint" style="margin-top:5px">60 秒内只能发送一次，10 分钟内有效。</div></div>`;
  const emailField = '<div class="field"><label>邮箱</label><input class="input" id="aEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>';
  const pwField = (id, label, ph) => `<div class="field"><label>${label}</label><input class="input" id="${id}" type="password" autocomplete="new-password" placeholder="${ph}"></div>`;
  let html = '';
  if (authTab === 'login') {
    html = emailField + pwField('aPw','密码','输入密码') + `<button class="btn primary" id="aSubmit" style="width:100%">登录</button>`;
  } else if (authTab === 'code') {
    html = emailField + codeRow('login') + `<button class="btn primary" id="aSubmit" style="width:100%">验证码登录</button>`;
  } else if (authTab === 'register') {
    html = emailField + `<div class="field"><label>用户名</label><input class="input" id="aUser" maxlength="20" placeholder="2~20 位，中英文数字"></div>`
      + pwField('aPw','密码','至少 8 位') + codeRow('register')
      + `<button class="btn primary" id="aSubmit" style="width:100%">注册并登录</button>`;
  } else {
    html = emailField + pwField('aPw','新密码','至少 8 位') + codeRow('reset')
      + `<button class="btn primary" id="aSubmit" style="width:100%">重置密码</button>`;
  }
  box.innerHTML = html;
  const sc = $('#sendCode');
  if (sc) sc.onclick = async () => {
    const email = $('#aEmail').value.trim();
    if (!email) { toast('请先填写邮箱', 'err'); return; }
    sc.disabled = true;
    try {
      const d = await api('/api/auth/code', { method:'POST', body:{ email, scene: sc.dataset.scene } });
      toast(d.devCode ? ('调试验证码：' + d.devCode) : '验证码已发送，请查收邮箱', 'ok');
      let left = 60;
      const t = setInterval(() => { left--; sc.textContent = left > 0 ? `${left}s 后重发` : '获取验证码'; if (left <= 0) { clearInterval(t); sc.disabled = false; } }, 1000);
      sc.textContent = '60s 后重发';
    } catch (e) { toast(e.message, 'err'); sc.disabled = false; }
  };
  $('#aSubmit').onclick = async () => {
    const email = $('#aEmail').value.trim();
    const body = { email };
    let path = '';
    if (authTab === 'login') { path = '/api/auth/login'; body.password = $('#aPw').value; }
    else if (authTab === 'code') { path = '/api/auth/login_code'; body.code = $('#aCode').value.trim(); }
    else if (authTab === 'register') {
      path = '/api/auth/register';
      body.username = $('#aUser').value.trim(); body.password = $('#aPw').value; body.code = $('#aCode').value.trim();
    } else {
      path = '/api/auth/reset'; body.password = $('#aPw').value; body.code = $('#aCode').value.trim();
    }
    $('#aSubmit').disabled = true;
    try {
      const d = await api(path, { method:'POST', body });
      if (authTab === 'reset') { toast('密码已重置，请重新登录', 'ok'); authTab = 'login'; viewLogin(); return; }
      state.me = d.me; updateTop(); toast('欢迎来到不知名社区', 'ok'); go('#/community');
    } catch (e) { toast(e.message, 'err'); $('#aSubmit').disabled = false; }
  };
}

/* ---------------- 路由 ---------------- */
function parseRoute(){
  const h = location.hash.replace(/^#\/?/, '') || 'community';
  const [a, b, c] = h.split('/');
  if (a === 'post' && b && c === 'edit') return { name:'postedit', id:b };
  if (a === 'post' && b) return { name:'post', id:b };
  if (a === 'new') return { name:'new' };
  if (a === 'mods') return { name:'mods' };
  if (a === 'mod' && b === 'new') return { name:'modnew' };
  if (a === 'mod' && b && c === 'edit') return { name:'modedit', id:b };
  if (a === 'mod' && b) return { name:'mod', id:b };
  if (a === 'me') return { name:'me' };
  if (a === 'user' && b) return { name:'user', id:decodeURIComponent(b) };
  if (a === 'login') return { name:'login' };
  return { name:'community' };
}
async function renderRoute(){
  const r = parseRoute();
  const prev = state.route ? state.route.name : null;
  state.route = r;
  closeDrawer();
  if (prev !== r.name && (r.name === 'community' || r.name === 'mods')) state.q = '';
  const app = $('#app');
  app.classList.remove('page-anim');
  try {
    if (r.name === 'community') await viewCommunity();
    else if (r.name === 'post') await viewPost(r.id);
    else if (r.name === 'new') await viewNew();
    else if (r.name === 'postedit') await viewNew(r.id);
    else if (r.name === 'mods') await viewMods();
    else if (r.name === 'mod') await viewMod(r.id);
    else if (r.name === 'modnew') await viewModNew();
    else if (r.name === 'modedit') await viewModNew(r.id);
    else if (r.name === 'me') await viewMe();
    else if (r.name === 'user') await viewUser(r.id);
    else viewLogin();
  } catch (e) {
    $('#app').innerHTML = `<div class="card empty">页面加载失败：${esc(e.message)}</div>`;
  }
  void app.offsetWidth;               // 强制重播进入动画
  app.classList.add('page-anim');
  window.scrollTo(0, 0);
}

/* ---------------- 绑定 / 启动 ---------------- */
$('#hamb').onclick = openDrawer;
$('#drawerMask').onclick = closeDrawer;
$('#brand').onclick = () => go('#/community');
$('#loginBtn').onclick = () => go('#/login');
$('#meBtn').onclick = () => go('#/me');
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', cur);
  try { localStorage.setItem('bzm_theme', cur); } catch (_) {}
};
window.addEventListener('hashchange', renderRoute);
window.addEventListener('error', e => { if (e.message) console.error('[ui]', e.message); });

(async function boot(){
  try {
    const saved = localStorage.getItem('bzm_theme');
    document.documentElement.setAttribute('data-theme',
      saved || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  } catch (_) {}
  try {
    state.boot = await api('/api/bootstrap');
    state.me = state.boot.me;
    state.build = state.boot.build || '';
  } catch (e) {
    $('#app').innerHTML = `<div class="card empty">初始化失败：${esc(e.message)}<br><br><span class="hint">请检查 D1 / KV 绑定是否已配置（访问 /api/health 查看状态）。</span></div>`;
    return;
  }
  updateTop();
  const err = new URLSearchParams(location.search).get('err');
  if (err) toast('授权失败：' + err, 'err');
  renderRoute();
})();

})();
</script>
